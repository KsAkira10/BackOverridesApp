name: Semantic Release & Publish

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Forçar liberação de versão na main mesmo sem PR (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  packages: write
  pull-requests: read
  id-token: write

jobs:
  # =========================================================================
  # 1. Release Candidate (Branches feat/** e fix/**)
  # =========================================================================
  release-candidate:
    name: Release Candidate (feat/fix)
    if: startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build
          npm test

      - name: Determine Release Candidate Version
        id: semver
        run: node scripts/semver-release.mjs rc

      - name: Package Chrome/Edge Extension
        run: |
          mkdir -p dist-assets
          cd packages/extension
          zip -r ../../dist-assets/back-overrides-chrome-extension.zip manifest.json background.js popup.html popup.js README.md
          cd ../..
          echo "Extension packaged for RC:"
          ls -lh dist-assets/

      - name: Publish GitHub Pre-Release (RC)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag_name }}
          name: BackOverrides ${{ steps.semver.outputs.tag_name }}
          body_path: ${{ steps.semver.outputs.release_notes_file }}
          files: dist-assets/back-overrides-chrome-extension.zip
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notice RC Created
        run: |
          echo "::notice title=Release Candidate Publicado::Tag ${{ steps.semver.outputs.tag_name }} gerada com sucesso para a branch ${{ github.ref_name }}."

  # =========================================================================
  # 2. Final Release & Publish (Branch main após PR Merge)
  # =========================================================================
  final-release:
    name: Final Release (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build
          npm test

      - name: Resolve Semantic Version & Verify PR Merge
        id: semver
        run: node scripts/semver-release.mjs final
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ github.event.inputs.force_release }}

      - name: Commit Version Bumps & CHANGELOG
        if: steps.semver.outputs.should_release == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json packages/*/package.json packages/extension/manifest.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.semver.outputs.tag_name }} [skip ci]"
          git tag ${{ steps.semver.outputs.tag_name }}
          git push origin main --tags

      - name: Package Chrome/Edge Extension
        if: steps.semver.outputs.should_release == 'true'
        run: |
          mkdir -p dist-assets
          cd packages/extension
          zip -r ../../dist-assets/back-overrides-chrome-extension.zip manifest.json background.js popup.html popup.js README.md
          cd ../..
          echo "Extension packaged for Final Release:"
          ls -lh dist-assets/

      - name: Publish Official GitHub Release
        if: steps.semver.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag_name }}
          name: BackOverrides ${{ steps.semver.outputs.tag_name }}
          body_path: ${{ steps.semver.outputs.release_notes_file }}
          files: dist-assets/back-overrides-chrome-extension.zip
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Packages to NPM (Official Release)
        if: steps.semver.outputs.should_release == 'true' && env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publicando pacotes oficiais no registro NPM..."
          npm publish --workspace=@back-overrides/core --access public
          npm publish --workspace=@back-overrides/client --access public
          npm publish --workspace=@back-overrides/cli --access public

      - name: Notice Direct Commit Skipped
        if: steps.semver.outputs.should_release != 'true'
        run: |
          echo "::notice title=Release Ignorado (Commit Direto na Main)::Commits diretos na branch main não geram tag ou versão. Abra um Pull Request e faça merge para disparar a release oficial com Semantic Versioning."

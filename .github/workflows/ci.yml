name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commit-lint:
    name: Validate Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Commit Messages
        run: |
          echo "Verificando mensagens de commits no Pull Request..."
          COMMITS=$(git log origin/${{ github.base_ref }}..HEAD --format="%s")
          node -e '
            const raw = process.argv[1];
            const commits = raw.split("\n").map(s => s.trim()).filter(Boolean);
            const regex = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.-]+\))?(!)?: .+/;
            let errors = 0;
            for (const c of commits) {
              if (c.startsWith("Merge ")) continue;
              if (!regex.test(c)) {
                console.error("❌ Commit fora do padrão Conventional Commits:", c);
                errors++;
              } else {
                console.log("✅ Válido:", c);
              }
            }
            if (errors > 0) {
              console.error(`\nErro: ${errors} commit(s) não seguem o padrão Conventional Commits (ex: feat(core): ..., fix: ...).`);
              process.exit(1);
            }
          ' "$COMMITS"

  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build All Workspaces
        run: npm run build

      - name: Run Tests
        run: npm test

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BackOverrides</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .2s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(20px); }

    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .rules-list {
      max-height: 160px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
    }
    .rule-item {
      background: #0f172a;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
      border: 1px solid #334155;
    }
    .rule-source { color: #f87171; word-break: break-all; margin-bottom: 4px; }
    .rule-target { color: #34d399; word-break: break-all; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn:hover { background: #0369a1; }
    .status {
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
      color: #94a3b8;
    }
    .status.success { color: #34d399; }
    .status.error { color: #f87171; }
    .feature-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      border: 1px solid #0369a1;
      color: #38bdf8;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      margin-bottom: 12px;
      width: 100%;
      justify-content: center;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }
    .port-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .badge-dot.offline {
      background: #f87171;
      box-shadow: 0 0 6px #f87171;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      padding: 8px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .btn-outline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      padding: 8px;
      background: transparent;
      color: #38bdf8;
      border: 1px solid #0284c7;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all .2s;
    }
    .btn-outline:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>⚡ BackOverrides</span>
    </div>
    <div class="toggle-container">
      <label class="switch">
        <input type="checkbox" id="toggle-active" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="feature-badge">
    <span class="badge-dot"></span> Suporta <strong>main_frame</strong> (Navegações & OAuth)
  </div>

  <div class="card">
    <div class="card-title">Regras de Interceptação Ativas</div>
    <div class="rules-list" id="rules-container">
      Carregando regras...
    </div>
  </div>

  <div class="port-badge" id="port-badge">
    <span class="badge-dot" id="port-dot"></span>
    <span id="port-text">CLI: localhost:8888</span>
  </div>

  <button class="btn" id="btn-sync">
    🔄 Sincronizar com CLI
  </button>

  <div class="btn-group">
    <button class="btn-secondary" id="btn-reload-ext" title="Recarrega a extensão por completo">
      ⚡ Recarregar Extensão
    </button>
    <button class="btn-secondary" id="btn-reload-tab" title="Recarrega a aba ativa do navegador">
      🔄 Recarregar Aba
    </button>
  </div>

  <button class="btn-outline" id="btn-open-options">
    ⚙️ Studio & Gerador de Content Script
  </button>

  <div class="status" id="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
